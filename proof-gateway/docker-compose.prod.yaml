version: '3.8'

services:
  # 1. The Official Midnight ZK Proof Server
  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    container_name: vericred-prod-proof-server
    restart: always
    command: ["midnight-proof-server -v"]
    expose:
      - "6300"
    environment:
      RUST_BACKTRACE: "full"

  # 2. Our Public Secure Gateway (Handles CORS & Rate Limiting)
  proof-gateway:
    build: .
    container_name: vericred-prod-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - INTERNAL_PROOF_SERVER_URL=http://proof-server:6300
      - ALLOWED_ORIGIN=https://veri-cred.vercel.app
    depends_on:
      - proof-server  